# Ingress — the single entry point for external traffic into the cluster.
# Routes HTTP/HTTPS requests to the correct service based on hostname/path.
#
# Prerequisites (install once per cluster):
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml
#
# The cert-manager annotation below automatically provisions a free TLS
# certificate from Let's Encrypt when cert-manager is installed:
#   kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fraud-detection-ingress
  namespace: mlops-prod
  labels:
    app: fraud-detection
  annotations:
    # Use nginx ingress controller
    kubernetes.io/ingress.class: "nginx"

    # Automatically provision TLS cert from Let's Encrypt (free)
    # Remove these two lines if you don't have cert-manager installed
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Redirect HTTP → HTTPS automatically
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    # Rate limiting — prevents abuse of the /predict endpoint
    nginx.ingress.kubernetes.io/limit-rps: "10"
spec:
  tls:
  - hosts:
    - fraud-api.yourdomain.com      # replace with your actual domain
    secretName: fraud-api-tls       # cert-manager stores the cert here

  rules:
  - host: fraud-api.yourdomain.com  # replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fraud-detection-service
            port:
              number: 80