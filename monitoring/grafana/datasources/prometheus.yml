# Grafana reads this file on startup and automatically creates the datasource.
# No manual clicks needed. Every developer gets the same setup instantly.
#
# Grafana provisioning docs:
# https://grafana.com/docs/grafana/latest/administration/provisioning/
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy

    # 'prometheus' is the service name in docker-compose — Docker DNS resolves it
    url: http://prometheus:9090

    isDefault: true       # this datasource is selected by default in all panels
    editable: false       # prevents accidental changes via the UI