# Secret stores sensitive values — base64 encoded (NOT encrypted by default).
# For real production: use Sealed Secrets, AWS Secrets Manager, or Vault.
#
# IMPORTANT: In a real project, this file would NOT be committed to git
# with real values. Either:
#   1. Commit with placeholder values (like this file) and apply real values manually
#   2. Use External Secrets Operator to sync from a real secrets manager
#   3. Generate via CI/CD pipeline from environment secrets
#
# To encode a value: echo -n "mypassword" | base64
# To decode a value: echo "bXlwYXNzd29yZA==" | base64 --decode
apiVersion: v1
kind: Secret
metadata:
  name: fraud-api-secret
  namespace: mlops-prod
  labels:
    app: fraud-detection
type: Opaque
data:
  # Placeholder values — replace with real base64-encoded secrets before deploying
  # echo -n "replace-with-real-api-key" | base64
  API_SECRET_KEY: cmVwbGFjZS13aXRoLXJlYWwtYXBpLWtleQ==